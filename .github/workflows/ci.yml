name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # luau-lsp is not on the runners; pin the release and its checksum.
  LUAU_LSP_VERSION: 1.70.1
  LUAU_LSP_SHA256: 1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567
  # The luau CLI runs tests/*_test.luau; same pinning.
  LUAU_VERSION: "0.743"
  LUAU_SHA256_UBUNTU: 99d45afb4afaee00ba631c526c8e8c76c67b60f6f119953ce6409be6d6953663
  LUAU_SHA256_MACOS: 4334afbfb0c05ee697c9bfea64a85f950249c1e8f6f7d99aaa5a24ee362b09c3

jobs:
  luau:
    name: Luau analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install luau-lsp
        run: |
          curl -fsSL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          echo "${LUAU_LSP_SHA256}  luau-lsp.zip" | sha256sum -c -
          unzip -q luau-lsp.zip luau-lsp
          chmod +x luau-lsp
      # .github/tern.d.luau is a pinned copy of `tern plugin types DIR`; refresh it by hand when Tern updates.
      - name: Analyze
        run: ./luau-lsp analyze --platform=standard --definitions=@tern=.github/tern.d.luau host.luau window.luau lib/*.luau

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/check-manifest.py

  # Linux only: syntax and ShellCheck don't depend on the OS. Tests (below) cover the macOS userland.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax under sh (dash) and bash
        run: |
          for f in scripts/scan.sh dev/tern-test dev/tern-test-ctl tests/*.sh; do
            sh -n "$f"
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck -s sh -S warning scripts/scan.sh dev/tern-test dev/tern-test-ctl tests/*.sh

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tests/awk_test.sh runs agent.awk under every awk it finds (system awk, gawk, mawk on Linux).
      - name: Install luau and awks
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            asset=luau-ubuntu.zip sum=$LUAU_SHA256_UBUNTU
            sudo apt-get update -qq && sudo apt-get install -y -qq gawk mawk
          else
            asset=luau-macos.zip sum=$LUAU_SHA256_MACOS
            brew install gawk
          fi
          curl -fsSL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/${asset}"
          echo "${sum}  luau.zip" | shasum -a 256 -c -
          unzip -q luau.zip luau -d "$RUNNER_TEMP/luau"
          echo "$RUNNER_TEMP/luau" >>"$GITHUB_PATH"
      - run: sh tests/run.sh
